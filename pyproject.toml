[project]
name = "trench01"
version = "0.1.0"
description = "トレンチ構造の表面帯電 2D シミュレーター (CLI + Tkinter GUI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numba>=0.67 ; python_full_version >= '3.10'",
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda13x>=14.0 ; python_full_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
